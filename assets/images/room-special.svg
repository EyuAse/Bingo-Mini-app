<svg viewBox="0 0 240 190" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
  <defs>
    <!-- Card Blue Gradient -->
    <linearGradient id="bCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="50%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#082f49"/>
    </linearGradient>

    <!-- Card 3D Stroke Highlight -->
    <linearGradient id="bCardStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93c5fd"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <!-- 3D Ball Sphere Lighting (Electric Royal Blue) -->
    <radialGradient id="bBallSphere" cx="30%" cy="26%" r="72%">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="15%" stop-color="#93c5fd"/>
      <stop offset="45%" stop-color="#3b82f6"/>
      <stop offset="75%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#082f49"/>
    </radialGradient>

    <!-- 3D Star Gradient -->
    <linearGradient id="star3d" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#facc15"/>
      <stop offset="75%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>

    <linearGradient id="discShade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>

    <filter id="bCardShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
    <filter id="bBallShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="9" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
    <filter id="bGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient Stars & Sparkles -->
  <g opacity="0.9">
    <path d="M35 45 L38.5 49 L35 53 L31.5 49 Z" fill="#bfdbfe" filter="url(#bGlow)"/>
    <path d="M205 38 L209 43 L205 48 L201 43 Z" fill="#bfdbfe" filter="url(#bGlow)"/>
    <path d="M195 110 L197.5 113 L195 116 L192.5 113 Z" fill="#93c5fd"/>
    <circle cx="50" cy="115" r="2" fill="#60a5fa" opacity="0.7"/>
    <circle cx="185" cy="65" r="1.5" fill="#dbeafe" opacity="0.8"/>
  </g>

  <!-- Left Tilted Card (-14deg) -->
  <g transform="translate(85, 80) rotate(-14) translate(-46, -60)" filter="url(#bCardShadow)">
    <rect x="0" y="0" width="92" height="114" rx="10" fill="url(#bCardGrad)" stroke="url(#bCardStroke)" stroke-width="3"/>
    <rect x="3" y="3" width="86" height="108" rx="8" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <text x="46" y="19" fill="#ffffff" font-family="'Outfit', 'Inter', sans-serif" font-weight="900" font-size="12" text-anchor="middle" letter-spacing="3.5">BINGO</text>
    <rect x="6" y="26" width="80" height="80" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
    <g stroke="#cbd5e1" stroke-width="1">
      <line x1="32.6" y1="26" x2="32.6" y2="106"/>
      <line x1="59.3" y1="26" x2="59.3" y2="106"/>
      <line x1="6" y1="52.6" x2="86" y2="52.6"/>
      <line x1="6" y1="79.3" x2="86" y2="79.3"/>
    </g>
    <g fill="#082f49" font-family="'Outfit', 'Inter', sans-serif" font-weight="800" font-size="11.5" text-anchor="middle">
      <text x="19.3" y="44.5">13</text><text x="46" y="44.5">13</text><text x="72.6" y="44.5">13</text>
      <text x="19.3" y="71">23</text><text x="46" y="71.5" fill="#2563eb" font-size="13">★</text><text x="72.6" y="71">23</text>
      <text x="19.3" y="98">13</text><text x="46" y="98">23</text><text x="72.6" y="98">33</text>
    </g>
  </g>

  <!-- Right Tilted Card (+14deg) -->
  <g transform="translate(155, 82) rotate(14) translate(-46, -60)" filter="url(#bCardShadow)">
    <rect x="0" y="0" width="92" height="114" rx="10" fill="url(#bCardGrad)" stroke="url(#bCardStroke)" stroke-width="3"/>
    <rect x="3" y="3" width="86" height="108" rx="8" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <text x="46" y="19" fill="#ffffff" font-family="'Outfit', 'Inter', sans-serif" font-weight="900" font-size="12" text-anchor="middle" letter-spacing="3.5">BINGO</text>
    <rect x="6" y="26" width="80" height="80" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
    <g stroke="#cbd5e1" stroke-width="1">
      <line x1="32.6" y1="26" x2="32.6" y2="106"/>
      <line x1="59.3" y1="26" x2="59.3" y2="106"/>
      <line x1="6" y1="52.6" x2="86" y2="52.6"/>
      <line x1="6" y1="79.3" x2="86" y2="79.3"/>
    </g>
    <g fill="#082f49" font-family="'Outfit', 'Inter', sans-serif" font-weight="800" font-size="11.5" text-anchor="middle">
      <text x="19.3" y="44.5">13</text><text x="46" y="44.5">33</text><text x="72.6" y="44.5">33</text>
      <text x="19.3" y="71">23</text><text x="46" y="71.5" fill="#2563eb" font-size="13">★</text><text x="72.6" y="71">23</text>
      <text x="19.3" y="98">33</text><text x="46" y="98">33</text><text x="72.6" y="98">33</text>
    </g>
  </g>

  <!-- 3D Glossy Special Ball with Star (Centered Front) -->
  <g filter="url(#bBallShadow)">
    <circle cx="120" cy="106" r="44" fill="url(#bBallSphere)"/>
    <circle cx="120" cy="106" r="43.5" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1.2"/>
    
    <ellipse cx="106" cy="80" rx="14" ry="7" transform="rotate(-25 106 80)" fill="#ffffff" opacity="0.35"/>

    <circle cx="120" cy="106" r="32" fill="none" stroke="#ffffff" stroke-width="2.5"/>

    <circle cx="120" cy="106" r="26" fill="url(#discShade)" stroke="rgba(0,0,0,0.12)" stroke-width="0.8"/>

    <!-- Golden 3D Star -->
    <polygon points="120,89 125.8,100.8 138.8,102.7 129.4,111.8 131.6,124.7 120,118.6 108.4,124.7 110.6,111.8 101.2,102.7 114.2,100.8" fill="url(#star3d)" stroke="#a16207" stroke-width="1"/>
  </g>
</svg>
