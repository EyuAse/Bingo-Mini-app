<svg viewBox="0 0 240 190" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
  <defs>
    <!-- Card Orange Gradient -->
    <linearGradient id="oCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="50%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#431407"/>
    </linearGradient>

    <!-- Card 3D Stroke Highlight -->
    <linearGradient id="oCardStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>

    <!-- 3D Ball Sphere Lighting (Amber/Orange) -->
    <radialGradient id="oBallSphere" cx="30%" cy="26%" r="72%">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="15%" stop-color="#fed7aa"/>
      <stop offset="45%" stop-color="#f97316"/>
      <stop offset="75%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#431407"/>
    </radialGradient>

    <linearGradient id="discShade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>

    <filter id="oCardShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
    <filter id="oBallShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="9" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
    <filter id="oGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient Stars & Sparkles -->
  <g opacity="0.9">
    <path d="M35 45 L38.5 49 L35 53 L31.5 49 Z" fill="#fed7aa" filter="url(#oGlow)"/>
    <path d="M205 38 L209 43 L205 48 L201 43 Z" fill="#fed7aa" filter="url(#oGlow)"/>
    <path d="M195 110 L197.5 113 L195 116 L192.5 113 Z" fill="#fdba74"/>
    <circle cx="50" cy="115" r="2" fill="#fb923c" opacity="0.7"/>
    <circle cx="185" cy="65" r="1.5" fill="#ffedd5" opacity="0.8"/>
  </g>

  <!-- Left Tilted Card (-14deg) -->
  <g transform="translate(85, 80) rotate(-14) translate(-46, -60)" filter="url(#oCardShadow)">
    <rect x="0" y="0" width="92" height="114" rx="10" fill="url(#oCardGrad)" stroke="url(#oCardStroke)" stroke-width="3"/>
    <rect x="3" y="3" width="86" height="108" rx="8" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <text x="46" y="19" fill="#ffffff" font-family="'Outfit', 'Inter', sans-serif" font-weight="900" font-size="12" text-anchor="middle" letter-spacing="3.5">BINGO</text>
    <rect x="6" y="26" width="80" height="80" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
    <g stroke="#cbd5e1" stroke-width="1">
      <line x1="32.6" y1="26" x2="32.6" y2="106"/>
      <line x1="59.3" y1="26" x2="59.3" y2="106"/>
      <line x1="6" y1="52.6" x2="86" y2="52.6"/>
      <line x1="6" y1="79.3" x2="86" y2="79.3"/>
    </g>
    <g fill="#431407" font-family="'Outfit', 'Inter', sans-serif" font-weight="800" font-size="11.5" text-anchor="middle">
      <text x="19.3" y="44.5">13</text><text x="46" y="44.5">13</text><text x="72.6" y="44.5">13</text>
      <text x="19.3" y="71">13</text><text x="46" y="71.5" fill="#ea580c" font-size="13">★</text><text x="72.6" y="71">33</text>
      <text x="19.3" y="98">23</text><text x="46" y="98">23</text><text x="72.6" y="98">33</text>
    </g>
  </g>

  <!-- Right Tilted Card (+14deg) -->
  <g transform="translate(155, 82) rotate(14) translate(-46, -60)" filter="url(#oCardShadow)">
    <rect x="0" y="0" width="92" height="114" rx="10" fill="url(#oCardGrad)" stroke="url(#oCardStroke)" stroke-width="3"/>
    <rect x="3" y="3" width="86" height="108" rx="8" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <text x="46" y="19" fill="#ffffff" font-family="'Outfit', 'Inter', sans-serif" font-weight="900" font-size="12" text-anchor="middle" letter-spacing="3.5">BINGO</text>
    <rect x="6" y="26" width="80" height="80" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
    <g stroke="#cbd5e1" stroke-width="1">
      <line x1="32.6" y1="26" x2="32.6" y2="106"/>
      <line x1="59.3" y1="26" x2="59.3" y2="106"/>
      <line x1="6" y1="52.6" x2="86" y2="52.6"/>
      <line x1="6" y1="79.3" x2="86" y2="79.3"/>
    </g>
    <g fill="#431407" font-family="'Outfit', 'Inter', sans-serif" font-weight="800" font-size="11.5" text-anchor="middle">
      <text x="19.3" y="44.5">13</text><text x="46" y="44.5">33</text><text x="72.6" y="44.5">33</text>
      <text x="19.3" y="71">23</text><text x="46" y="71.5" fill="#ea580c" font-size="13">★</text><text x="72.6" y="71">23</text>
      <text x="19.3" y="98">33</text><text x="46" y="98">33</text><text x="72.6" y="98">23</text>
    </g>
  </g>

  <!-- 3D Glossy 30 Ball (Centered Front) -->
  <g filter="url(#oBallShadow)">
    <circle cx="120" cy="106" r="44" fill="url(#oBallSphere)"/>
    <circle cx="120" cy="106" r="43.5" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1.2"/>
    
    <ellipse cx="106" cy="80" rx="14" ry="7" transform="rotate(-25 106 80)" fill="#ffffff" opacity="0.35"/>

    <circle cx="120" cy="106" r="32" fill="none" stroke="#ffffff" stroke-width="2.5"/>

    <circle cx="120" cy="106" r="26" fill="url(#discShade)" stroke="rgba(0,0,0,0.12)" stroke-width="0.8"/>

    <text x="120" y="117" fill="#431407" font-family="'Outfit', 'Inter', sans-serif" font-weight="900" font-size="30" text-anchor="middle" letter-spacing="-1.5">30</text>
  </g>
</svg>
